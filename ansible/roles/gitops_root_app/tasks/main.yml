---
- name: Validate root app repository configuration
  ansible.builtin.assert:
    that:
      - gitops_root_app_repo_url is defined
      - gitops_root_app_repo_url | string | length > 0
    fail_msg: >
      gitops_root_app_repo_url must be set to the Git repository that houses your GitOps manifests.

- name: Build automatic plugin env context
  ansible.builtin.set_fact:
    gitops_root_app_auto_plugin_env: >-
      {{
        _auto_env_entries
        | rejectattr('value', 'equalto', '')
        | rejectattr('value', 'equalto', none)
        | list
      }}
  vars:
    _auto_env_entries:
      - name: PROJECT_NAME
        value: "{{ project_name | default('') }}"
      - name: AWS_REGION
        value: "{{ aws_region | default('') }}"
      - name: CLUSTER_NAME
        value: "{{ cluster.name | default('') }}"
      - name: CLUSTER_ENDPOINT
        value: "{{ cluster.endpoint | default('') }}"
      - name: OIDC_ISSUER_URL
        value: "{{ cluster.oidc_issuer_url | default('') }}"
      - name: KUBECONFIG_PATH
        value: "{{ cluster.kubeconfig.local_path | default('') }}"
      - name: SSH_PRIVATE_KEY_PATH
        value: "{{ cluster.ssh_private_key.local_path | default('') }}"
      - name: VPC_ID
        value: "{{ networking.vpc_id | default('') }}"
      - name: PUBLIC_SUBNET_IDS
        value: "{{ (networking.public_subnet_ids | default([])) | join(',') }}"
      - name: PRIVATE_SUBNET_IDS
        value: "{{ (networking.private_subnet_ids | default([])) | join(',') }}"
      - name: EBS_CSI_ROLE_ARN
        value: "{{ irsa.ebs_csi_role_arn | default('') }}"
      - name: EBS_CSI_NAMESPACE
        value: "{{ irsa.ebs_csi_namespace | default('') }}"
      - name: EBS_CSI_SERVICE_ACCOUNT
        value: "{{ irsa.ebs_csi_service_account | default('') }}"
      - name: CA_ROLE_ARN
        value: "{{ irsa.cluster_autoscaler_role_arn | default('') }}"
      - name: ALB_CONTROLLER_ROLE_ARN
        value: "{{ irsa.alb_controller_role_arn | default('') }}"
      - name: ALB_CONTROLLER_NAMESPACE
        value: "{{ irsa.alb_controller_namespace | default('') }}"
      - name: ALB_CONTROLLER_SERVICE_ACCOUNT
        value: "{{ irsa.alb_controller_service_account | default('') }}"
      - name: EKS_CLUSTER_ROLE_ARN
        value: "{{ iam_roles.eks_cluster_role_arn | default('') }}"
      - name: EKS_NODE_ROLE_ARN
        value: "{{ iam_roles.eks_node_role_arn | default('') }}"
      - name: BASTION_PUBLIC_IP
        value: "{{ bastion.public_ip | default('') }}"
      - name: ARGOCD_NAMESPACE
        value: "{{ argocd_namespace | default('argocd') }}"
      - name: ROOT_APP_NAME
        value: "{{ gitops_root_app_name }}"
      - name: CROSSPLANE_NAMESPACE
        value: "{{ irsa.crossplane_namespace }}"
      - name: CROSSPLANE_CORE_ROLE_ARN
        value: "{{ irsa.crossplane_core_role_arn | default('') }}"
      - name: CROSSPLANE_CORE_SERVICE_ACCOUNT
        value: "{{ (irsa.crossplane_core_service_accounts | default([])) | first | default('') }}"
      - name: CROSSPLANE_DATA_ROLE_ARN
        value: "{{ irsa.crossplane_data_role_arn | default('') }}"
      - name: CROSSPLANE_DATA_SERVICE_ACCOUNT
        value: "{{ (irsa.crossplane_data_service_accounts | default([])) | first | default('') }}"
      - name: GATEWAY_API_NAMESPACE
        value: "{{ gateway_api.namespace | default(irsa.alb_controller_namespace) }}"
      - name: GATEWAY_API_GATEWAY_CLASS_NAME
        value: "{{ gateway_api.gateway_class_name | default('aws-alb-gateway-class') }}"
      - name: GATEWAY_API_CONTROLLER_TARGET_TYPE
        value: "{{ gateway_api.controller.default_target_type | default('ip') }}"
      - name: GATEWAY_API_CONTROLLER_ENABLE_ALB_GATEWAY
        value: "{{ (gateway_api.controller.enable_alb_gateway | default(true)) | ternary('true', 'false') }}"
      - name: GATEWAY_API_CONTROLLER_ENABLE_NLB_GATEWAY
        value: "{{ (gateway_api.controller.enable_nlb_gateway | default(false)) | ternary('true', 'false') }}"
      - name: GATEWAY_API_CONTROLLER_ENABLE_SHIELD_ADDON
        value: "{{ (gateway_api.controller.enable_shield_addon | default(true)) | ternary('true', 'false') }}"
      - name: GATEWAY_API_CONTROLLER_ENABLE_WAF_ADDON
        value: "{{ (gateway_api.controller.enable_waf_addon | default(true)) | ternary('true', 'false') }}"
      - name: GATEWAY_API_CONTROLLER_ENABLE_WAFV2_ADDON
        value: "{{ (gateway_api.controller.enable_wafv2_addon | default(true)) | ternary('true', 'false') }}"
      - name: GATEWAY_API_CONTROLLER_LOG_LEVEL
        value: "{{ gateway_api.controller.log_level | default('info') }}"
      - name: GATEWAY_API_LOAD_BALANCER_IP_ADDRESS_TYPE
        value: "{{ gateway_api.load_balancer.ip_address_type | default('ipv4') }}"
      - name: GATEWAY_API_LOAD_BALANCER_EXTERNAL_SCHEME
        value: "{{ gateway_api.load_balancer.external_scheme | default('internet-facing') }}"
      - name: GATEWAY_API_LOAD_BALANCER_INTERNAL_SCHEME
        value: "{{ gateway_api.load_balancer.internal_scheme | default('internal') }}"
      - name: GATEWAY_API_LOAD_BALANCER_DELETION_PROTECTION
        value: "{{ (gateway_api.load_balancer.deletion_protection_enabled | default(true)) | ternary('true', 'false') }}"
      - name: GATEWAY_API_LOAD_BALANCER_IDLE_TIMEOUT
        value: "{{ gateway_api.load_balancer.idle_timeout_seconds | default(60) }}"
      - name: GATEWAY_API_LOAD_BALANCER_EXTERNAL_WAF_ARN
        value: "{{ gateway_api.load_balancer.external_wafv2_acl_arn | default('') }}"
      - name: GATEWAY_API_LOAD_BALANCER_INTERNAL_WAF_ARN
        value: "{{ gateway_api.load_balancer.internal_wafv2_acl_arn | default('') }}"
      - name: GATEWAY_API_LOAD_BALANCER_EXTERNAL_SHIELD
        value: "{{ (gateway_api.load_balancer.external_shield_enabled | default(true)) | ternary('true', 'false') }}"
      - name: GATEWAY_API_LOAD_BALANCER_INTERNAL_SHIELD
        value: "{{ (gateway_api.load_balancer.internal_shield_enabled | default(false)) | ternary('true', 'false') }}"
      - name: GATEWAY_API_LOAD_BALANCER_TAGS
        value: "{{ (gateway_api.load_balancer.tags | default({})) | to_nice_yaml | indent(4, true) }}"
      - name: GATEWAY_API_EXTERNAL_ENABLED
        value: "{{ (gateway_api.external_gateway.enabled | default(true)) | ternary('true', 'false') }}"
      - name: GATEWAY_API_EXTERNAL_NAME
        value: "{{ gateway_api.external_gateway.name | default('public-gateway') }}"
      - name: GATEWAY_API_EXTERNAL_CONFIG_NAME
        value: "{{ (gateway_api.external_gateway.name | default('public-gateway')) ~ '-config' }}"
      - name: GATEWAY_API_EXTERNAL_HTTP_PORT
        value: "{{ gateway_api.external_gateway.http_port | default(80) }}"
      - name: GATEWAY_API_EXTERNAL_HTTPS_PORT
        value: "{{ gateway_api.external_gateway.https_port | default(443) }}"
      - name: GATEWAY_API_EXTERNAL_HOSTNAME
        value: "{{ gateway_api.external_gateway.hostname | default('') }}"
      - name: GATEWAY_API_EXTERNAL_ALLOWED_ROUTES
        value: "{{ gateway_api.external_gateway.allowed_routes_from | default('All') }}"
      - name: GATEWAY_API_EXTERNAL_TLS_CERT_ARN
        value: "{{ gateway_api.external_gateway.tls_certificate_arn | default('') }}"
      - name: GATEWAY_API_EXTERNAL_TLS_ENABLED
        value: >-
          {{
            (
              (
                gateway_api.external_gateway.enabled | default(true)
              )
              and (
                gateway_api.external_gateway.https_port | default(0) | int > 0
              )
              and (
                gateway_api.external_gateway.tls_certificate_arn | default('') | length > 0
              )
            )
            | ternary('true', 'false')
          }}
      - name: GATEWAY_API_EXTERNAL_WAF_ENABLED
        value: >-
          {{
            (
              (
                gateway_api.external_gateway.enabled | default(true)
              )
              and (
                gateway_api.load_balancer.external_wafv2_acl_arn | default('') | length > 0
              )
            )
            | ternary('true', 'false')
          }}
      - name: GATEWAY_API_INTERNAL_ENABLED
        value: "{{ (gateway_api.internal_gateway.enabled | default(true)) | ternary('true', 'false') }}"
      - name: GATEWAY_API_INTERNAL_NAME
        value: "{{ gateway_api.internal_gateway.name | default('internal-gateway') }}"
      - name: GATEWAY_API_INTERNAL_CONFIG_NAME
        value: "{{ (gateway_api.internal_gateway.name | default('internal-gateway')) ~ '-config' }}"
      - name: GATEWAY_API_INTERNAL_HTTP_PORT
        value: "{{ gateway_api.internal_gateway.http_port | default(8080) }}"
      - name: GATEWAY_API_INTERNAL_HTTPS_PORT
        value: "{{ gateway_api.internal_gateway.https_port | default(8443) }}"
      - name: GATEWAY_API_INTERNAL_HOSTNAME
        value: "{{ gateway_api.internal_gateway.hostname | default('') }}"
      - name: GATEWAY_API_INTERNAL_ALLOWED_ROUTES
        value: "{{ gateway_api.internal_gateway.allowed_routes_from | default('Same') }}"
      - name: GATEWAY_API_INTERNAL_TLS_CERT_ARN
        value: "{{ gateway_api.internal_gateway.tls_certificate_arn | default('') }}"
      - name: GATEWAY_API_INTERNAL_TLS_ENABLED
        value: >-
          {{
            (
              (
                gateway_api.internal_gateway.enabled | default(true)
              )
              and (
                gateway_api.internal_gateway.https_port | default(0) | int > 0
              )
              and (
                gateway_api.internal_gateway.tls_certificate_arn | default('') | length > 0
              )
            )
            | ternary('true', 'false')
          }}
      - name: GATEWAY_API_INTERNAL_WAF_ENABLED
        value: >-
          {{
            (
              (
                gateway_api.internal_gateway.enabled | default(true)
              )
              and (
                gateway_api.load_balancer.internal_wafv2_acl_arn | default('') | length > 0
              )
            )
            | ternary('true', 'false')
          }}

- name: Render root application manifest for auditing
  ansible.builtin.template:
    src: app-of-apps.yaml.j2
    dest: "{{ gitops_root_app_manifest_path }}"
    mode: "0600"

- name: Apply Argo CD root application
  kubernetes.core.k8s:
    state: present
    kubeconfig: "{{ argocd_kubeconfig }}"
    src: "{{ gitops_root_app_manifest_path }}"

- name: Confirm root application presence
  kubernetes.core.k8s_info:
    api_version: argoproj.io/v1alpha1
    kind: Application
    name: "{{ gitops_root_app_name }}"
    namespace: "{{ gitops_root_app_namespace }}"
    kubeconfig: "{{ argocd_kubeconfig }}"
  register: gitops_root_app_info
  changed_when: false
  failed_when: (gitops_root_app_info.resources | default([])) | length == 0
