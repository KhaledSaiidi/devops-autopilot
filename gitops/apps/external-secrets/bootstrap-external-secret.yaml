apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: ${EXTERNAL_SECRETS_BOOTSTRAP_TARGET_SECRET_NAME}
  namespace: ${EXTERNAL_SECRETS_BOOTSTRAP_TARGET_NAMESPACE}
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  refreshInterval: ${EXTERNAL_SECRETS_BOOTSTRAP_REFRESH_INTERVAL}
  secretStoreRef:
    kind: ClusterSecretStore
    name: ${EXTERNAL_SECRETS_BOOTSTRAP_SECRET_STORE_NAME}
  target:
    name: ${EXTERNAL_SECRETS_BOOTSTRAP_TARGET_SECRET_NAME}
    creationPolicy: Owner
    deletionPolicy: Retain
  dataFrom:
    - extract:
        key: ${EXTERNAL_SECRETS_BOOTSTRAP_SOURCE_SECRET_NAME}
