apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: ${EXTERNAL_SECRETS_NAMESPACE}
resources:
  - namespace.yaml
  - stores.yaml
helmCharts:
  - name: external-secrets
    repo: https://charts.external-secrets.io
    version: 1.1.0
    releaseName: external-secrets
    namespace: ${EXTERNAL_SECRETS_NAMESPACE}
    valuesFile: values.yaml
