apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: external-wildcard
  namespace: ${CERT_MANAGER_NAMESPACE}
  labels:
    app.kubernetes.io/name: cert-manager
    app.kubernetes.io/part-of: platform-baseline
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  secretName: ${CERT_MANAGER_EXTERNAL_CERT_SECRET}
  issuerRef:
    name: ${CERT_MANAGER_ISSUER_NAME}
    kind: ClusterIssuer
  dnsNames:
  - ${DNS_EXTERNAL_WILDCARD}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: internal-wildcard
  namespace: ${CERT_MANAGER_NAMESPACE}
  labels:
    app.kubernetes.io/name: cert-manager
    app.kubernetes.io/part-of: platform-baseline
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  secretName: ${CERT_MANAGER_INTERNAL_CERT_SECRET}
  issuerRef:
    name: ${CERT_MANAGER_ISSUER_NAME}
    kind: ClusterIssuer
  dnsNames:
  - ${DNS_INTERNAL_WILDCARD}
