apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: ${CERT_MANAGER_ISSUER_NAME}
  labels:
    app.kubernetes.io/name: cert-manager
    app.kubernetes.io/part-of: platform-baseline
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  acme:
    email: ${CERT_MANAGER_EMAIL}
    server: ${CERT_MANAGER_SERVER}
    privateKeySecretRef:
      name: ${CERT_MANAGER_PRIVATE_KEY_SECRET_NAME}
    solvers:
    - dns01:
        route53:
          hostedZoneID: ${DNS_HOSTED_ZONE_ID}
          region: ${AWS_REGION}
