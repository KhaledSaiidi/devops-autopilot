apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: ${CERT_MANAGER_NAMESPACE}
resources:
  - namespace.yaml
  - issuer.yaml
  - certificates.yaml
helmCharts:
  - name: cert-manager
    repo: https://charts.jetstack.io
    version: v1.15.3
    releaseName: cert-manager
    namespace: ${CERT_MANAGER_NAMESPACE}
    valuesFile: values.yaml
