apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: ${CROSSPLANE_NAMESPACE}
resources:
  - namespace.yaml
  - serviceaccounts.yaml
  - providerconfigs.yaml
  - providers.yaml
  - functions.yaml
helmCharts:
  - name: crossplane
    repo: https://charts.crossplane.io/stable
    version: 1.15.2
    releaseName: crossplane
    namespace: ${CROSSPLANE_NAMESPACE}
    valuesFile: values.yaml
