---
# Managed by argocd-lovely-plugin
projects:
- name: platform
  namespace: argocd
  description: Baseline platform services managed via GitOps.
  sourceRepos:
  - https://github.com/KhaledSaiidi/devops-autopilot.git
  destinations:
  - namespace: '*'
    server: https://kubernetes.default.svc
  clusterResourceWhitelist:
  - group: '*'
    kind: '*'
  namespaceResourceWhitelist:
  - group: '*'
    kind: '*'

applications:
- name: storage-stack
  namespace: argocd
  project: platform
  annotations:
    argocd.argoproj.io/sync-wave: "-4"
  labels:
    app.kubernetes.io/name: storage-stack
    app.kubernetes.io/part-of: platform-baseline
  source:
    repoURL: https://github.com/KhaledSaiidi/devops-autopilot.git
    targetRevision: main
    path: gitops/apps/storage
    directory:
      recurse: true
    plugin:
      name: envsubst
      env:
      - name: EBS_CSI_NAMESPACE
        value: ${EBS_CSI_NAMESPACE}
  destination:
    server: https://kubernetes.default.svc
    namespace: ${EBS_CSI_NAMESPACE}
  syncPolicy: &defaultSyncPolicy
    automated:
      prune: true
      selfHeal: true
    syncOptions:
    - CreateNamespace=true
    - ApplyOutOfSyncOnly=true
    - SkipDryRunOnMissingResource=true

