apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: crossplane
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: '-3'
  labels:
    app.kubernetes.io/name: crossplane
    app.kubernetes.io/part-of: platform-baseline
spec:
  project: platform
  source:
    repoURL: https://github.com/KhaledSaiidi/devops-autopilot.git
    targetRevision: main
    path: gitops/apps/crossplane
    plugin:
      name: argocd-lovely-plugin-v1.0
      env:
        - name: CROSSPLANE_NAMESPACE
          value: ${CROSSPLANE_NAMESPACE}
        - name: CROSSPLANE_CORE_ROLE_ARN
          value: ${CROSSPLANE_CORE_ROLE_ARN}
        - name: CROSSPLANE_CORE_SERVICE_ACCOUNT
          value: ${CROSSPLANE_CORE_SERVICE_ACCOUNT}
        - name: CROSSPLANE_DATA_ROLE_ARN
          value: ${CROSSPLANE_DATA_ROLE_ARN}
        - name: CROSSPLANE_DATA_SERVICE_ACCOUNT
          value: ${CROSSPLANE_DATA_SERVICE_ACCOUNT}
  destination:
    server: https://kubernetes.default.svc
    namespace: ${CROSSPLANE_NAMESPACE}
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
    - CreateNamespace=true
    - ApplyOutOfSyncOnly=true
    - SkipDryRunOnMissingResource=true
