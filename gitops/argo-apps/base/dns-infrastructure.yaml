apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: dns-infrastructure
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: '-4'
  labels:
    app.kubernetes.io/name: dns-infrastructure
    app.kubernetes.io/part-of: platform-baseline
spec:
  project: platform
  source:
    repoURL: https://github.com/KhaledSaiidi/devops-autopilot.git
    targetRevision: main
    path: gitops/apps/dns-infrastructure
    plugin:
      name: argocd-lovely-plugin-v1.0
      env:
        - name: AWS_REGION
          value: ${AWS_REGION}
        - name: DNS_BASE_DOMAIN
          value: ${DNS_BASE_DOMAIN}
        - name: DNS_EXTERNAL_LABEL
          value: ${DNS_EXTERNAL_LABEL}
        - name: DNS_INTERNAL_LABEL
          value: ${DNS_INTERNAL_LABEL}
        - name: PROJECT_NAME
          value: ${PROJECT_NAME}
        - name: DNS_HOSTED_ZONE_ID
          value: ${DNS_HOSTED_ZONE_ID}
        - name: VPC_ID
          value: ${VPC_ID}
  destination:
    server: https://kubernetes.default.svc
    namespace: ${CROSSPLANE_NAMESPACE}
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
    - CreateNamespace=true
    - ApplyOutOfSyncOnly=true
    - SkipDryRunOnMissingResource=true
